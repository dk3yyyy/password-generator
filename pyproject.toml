[project]
name = "password-generator"
version = "1.0.0"
description = "A secure, feature-rich password generator with CLI and beautiful web UI"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["password", "generator", "security", "cli", "web", "passphrase", "entropy"]
authors = [{name = "G0D👽", email = "dk3yyyy@email.com"}]
dependencies = [
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.27"]

[tool.uv]
package = false
