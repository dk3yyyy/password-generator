[project]
name = "password-generator"
version = "1.0.0"
description = "A secure password generator with CLI and web interface"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.uv]
package = false
